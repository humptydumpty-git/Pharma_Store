<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PharmaStore Management System</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- Optional utils used by other code -->
    <script defer src="src/utils/calculations.js"></script>
    <script defer src="src/utils/validation.js"></script>

    <meta name="theme-color" content="#667eea">
    <!-- Manifest is injected via script for allowed protocols -->

    <style>
        /* Minimal login styles for a nicer look */
        body { font-family: Inter, Roboto, Arial, sans-serif; margin:0; background: #f3f4f6; color:#111827; }
        .login-container { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
        .login-card { width: min(420px, 96%); background:#fff; border-radius:10px; padding:20px; box-shadow: 0 6px 28px rgba(0,0,0,0.08); }
        .login-card h2 { margin:0 0 12px; font-size:1.2rem; color:#0f172a; }
        .login-card input, .login-card select { width:100%; padding:10px; margin-bottom:10px; border:1px solid #e6e9ee; border-radius:8px; }
        .btn-primary { background:#4f46e5; color:#fff; padding:10px 12px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
        .btn-secondary { padding:8px 10px; background:#eef2ff; border:1px solid #dbeafe; cursor:pointer; border-radius:8px; }
        .form-message { margin-top:8px; font-size:0.9rem; min-height:18px; color:#dc2626; }
        .main-app { display:none; padding:18px; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-container" role="dialog" aria-labelledby="loginTitle" aria-modal="true">
        <div class="login-card" role="document">
            <h2 id="loginTitle"><i class="fas fa-pills"></i> PharmaStore Sign in</h2>

            <form id="loginForm" autocomplete="on" novalidate>
                <input id="username" name="username" type="text" required placeholder="Username" autocomplete="username" />
                <input id="password" name="password" type="password" required placeholder="Password" autocomplete="current-password" />
                <select id="userType" name="userType" aria-label="User Type">
                    <option value="">Any</option>
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                </select>

                <div style="display:flex; gap:8px; align-items:center; justify-content:flex-start;">
                    <button type="submit" class="btn-primary">Login</button>
                    <button type="button" class="btn-secondary" title="Fill demo credentials" id="demoCreds">Demo</button>
                </div>
                <div id="loginMessage" class="form-message" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="main-app">
        <header style="display:flex; gap:12px; align-items:center; justify-content:space-between; margin-bottom:12px;">
            <div><strong>PharmaStore</strong></div>
            <div>Logged in as: <span id="currentUser"></span></div>
        </header>

        <!-- Sales Section (multi-item sale UI + recent sales) -->
        <section id="sales" class="content-section">
            <h3>Sales</h3>

            <!-- Hidden template select (populated by app.js) -->
            <div id="saleTemplates" style="display:none;">
                <select id="saleDrug">
                    <option value="">Select Drug</option>
                </select>
            </div>

            <table class="sale-items-table" style="width:100%; border-collapse:collapse;">
                <thead>
                    <tr><th>Drug</th><th>Qty</th><th>Unit Price</th><th>Line Total</th><th>Action</th></tr>
                </thead>
                <tbody id="saleItemsBody">
                </tbody>
            </table>

            <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                <button id="addSaleItemBtn" class="btn-secondary">Add Item</button>
                <div style="margin-left:auto;"><strong>Subtotal: $<span id="saleSubtotal">0.00</span></strong></div>
                <button id="processMultiSaleBtn" class="btn-primary">Process Sale</button>
            </div>

            <div id="receiptContainer" style="display:none; margin-top:12px;">
                <div id="receiptContent" style="background:#fff; padding:12px; border-radius:8px; border:1px solid #e6e9ee;"></div>
            </div>

            <h4 style="margin-top:18px;">Recent Sales</h4>
            <table id="salesTable" style="width:100%; border-collapse:collapse;">
                <thead><tr><th>Date</th><th>Drug</th><th>Qty</th><th>Price</th><th>Total</th><th>Customer</th></tr></thead>
                <tbody id="salesTableBody"></tbody>
            </table>
        </section>
    </div>

    <!-- hidden input for import -->
    <input type="file" id="fileInput" accept=".json" style="display:none;" />

    <!-- Debug + safe service worker/manifest logic -->
    <script>
        // Debug: error catcher
        window.addEventListener('error', (ev) => {
            console.error('Captured error:', ev.error || ev.message || ev);
            try {
                const lm = document.getElementById('loginMessage');
                if (lm) lm.textContent = (ev.error?.message || ev.message || 'Error');
            } catch(e){}
        });
        window.addEventListener('unhandledrejection', (ev) => {
            console.error('Unhandled rejection:', ev.reason || ev);
        });

        // Only register SW when site is served via http(s)
        const allowed = (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
        if (allowed) {
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'manifest.json';
            document.head.appendChild(link);
        }
        if (allowed && 'serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(() => console.log('SW registered')).catch(e => console.warn('SW reg fail', e));
            });
        } else {
            console.log('Skipping SW/manifest registration (not served over HTTP/HTTPS).');
        }

        // Ensure login screen is visible on initial load
        window.addEventListener('DOMContentLoaded', () => {
            const ls = document.getElementById('loginScreen');
            const ma = document.getElementById('mainApp');
            if (ls && (!ma || ma.style.display === '' || ma.style.display === 'none')) {
                ls.style.display = 'flex';
            }
        });
    </script>

    <!-- app.js -->
    <script src="app.js" defer></script>
</body>
</html>
